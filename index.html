<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Школьная неделя</title>
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://gc.zgo.at; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://kaaandr.goatcounter.com; connect-src https://kaaandr.goatcounter.com; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<style>html:not(.top-ok) body{display:none!important}</style>
<script src="guard.js"></script>
<script data-goatcounter="https://kaaandr.goatcounter.com/count" async src="https://gc.zgo.at/count.v5.js" crossorigin="anonymous" integrity="sha384-atnOLvQb9t+jTSipvd75X2yginT4PjVbqDdlJAmxMm+wYElFmeR6EmLP5bYeoRVQ"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700&family=Unbounded:wght@700&display=swap">
<style>
:root{--bg:#F6F5F1;--panel:#FFFFFF;--ink:#1D1C19;--muted:#66655E;--line:#E4E1D8;--accent:#14305A}
@media (prefers-color-scheme:dark){:root{--bg:#141518;--panel:#1E1F23;--ink:#ECEBE6;--muted:#A3A198;--line:#33343A;--accent:#A9C2EE;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,sans-serif;padding:48px 16px}
main{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{margin:0;font-family:Unbounded,Manrope,sans-serif;font-size:clamp(28px,6vw,40px);color:var(--accent);line-height:1.1}
p{margin:0;color:var(--muted);line-height:1.55;font-size:15px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
a.card{display:flex;flex-direction:column;gap:6px;padding:20px;border-radius:14px;background:var(--panel);border:1px solid var(--line);color:inherit;text-decoration:none}
a.card:hover{border-color:var(--accent)}
a.card b{font-family:Unbounded,Manrope,sans-serif;font-size:22px;color:var(--accent)}
a.card span{color:var(--muted);font-size:14px}
</style>
</head>
<body>
<main>
<h1>Школьная неделя</h1>
<p>Конструктор расписания ребёнка на неделю: уроки, кружки, дорога, домашка. Расписание сохраняется в вашем браузере, его можно распечатать на A3.</p>
<div class="cards">
<a class="card" href="4/"><b>4.3</b><span>Начальная школа</span></a>
<a class="card" href="9/"><b>9.4</b><span>Основная школа</span></a>
</div>
<p style="font-size:12px">Сайт считает посещения без cookies и без сбора личных данных.</p>
</main>
</body>
</html>
